<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Damon Panel - الواجهة الرئيسية</title>
    <style>
        body { margin: 0; background: #0a0a23; color: white; font-family: 'Arial', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .card { background: rgba(255, 255, 255, 0.05); padding: 40px; border-radius: 25px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); width: 90%; max-width: 400px; }
        .profile-img { width: 150px; height: 150px; border-radius: 50%; border: 4px solid #fbc531; margin-bottom: 20px; object-fit: cover; }
        h1 { font-size: 1.8rem; margin-bottom: 30px; color: #fbc531; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; text-decoration: none; font-weight: bold; transition: 0.3s; cursor: pointer; border: none; font-size: 1.1rem; }
        .btn-slides { background: #fbc531; color: #0a0a23; }
        .btn-dev { background: #4834d4; color: white; }
        .btn:hover { transform: translateY(-3px); filter: brightness(1.1); }
    </style>
</head>
<body>

<div class="card">
    <img src="https://i.postimg.cc/SsMPRn2x/IMG-1726.jpg" class="profile-img" alt="Damon">
